<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planet-B · Rocket Studios</title>
<link rel="icon" href="assets/favicon.png?v=3">
<script>
// Aplica el tema antes de pintar la página para evitar parpadeos.
(function () {
  try {
    var d = document.documentElement;
    d.dataset.theme = localStorage.getItem("pb-theme") || "planet";
    d.dataset.mode = localStorage.getItem("pb-mode") || "dark";
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>

<section id="login" class="login">
  <div class="login-card">
    <span class="mark pb hero" role="img" aria-label="Planet-B"></span>
    <h1 class="brand big">Planet-B</h1>
    <p class="sub">Acceso privado · Cotizador de builds</p>
    <form id="login-form" class="login-form">
      <label>Correo<input type="email" id="email" required autocomplete="username"></label>
      <label>Contraseña<span class="pw"><input type="password" id="pass" required autocomplete="current-password"><button type="button" class="eye" id="eye" aria-label="Mostrar contraseña"></button></span></label>
      <button type="submit" class="btn-primary" id="go">Entrar</button>
      <p class="err" id="err"></p>
    </form>
    <div class="controls"></div>
    <div class="foot"><span class="mark rs" role="img" aria-label="Rocket Studios"></span><span>Rocket Studios</span></div>
  </div>
</section>

<main id="app" class="app" hidden>
  <header class="top">
    <div class="id">
      <span class="mark pb sm" role="img" aria-label="Planet-B"></span>
      <div>
        <div class="brand">Planet-B</div>
        <div class="sub" id="who"></div>
      </div>
    </div>
    <div class="top-right">
      <div class="seg">
        <button id="m-m" class="on">Mayorista</button>
        <button id="m-n">Normal</button>
      </div>
      <div class="controls"></div>
      <button id="logout" class="ghost">Salir</button>
    </div>
  </header>

  <div id="lines"></div>
  <button class="add" id="add">+ Agregar build</button>

  <div class="sum">
    <div class="r"><span>Builds</span><span id="qt">0</span></div>
    <div class="r"><span>Modo</span><span id="md">Mayorista</span></div>
    <div class="t"><span>Total</span><b id="tot">$0</b></div>
    <button class="copy" id="cp">Copiar resumen</button>
    <div class="ok" id="ok"></div>
  </div>
  <div class="foot"><span class="mark rs" role="img" aria-label="Rocket Studios"></span><span>Rocket Studios</span></div>
</main>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const root = document.documentElement;
  const enc = new TextEncoder(), dec = new TextDecoder();
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  // ----- Temas: color (paleta) + modo (claro / oscuro) -----
  const PALETTES = [
    { id: "planet", name: "Planet" },
    { id: "oceano", name: "Océano" },
    { id: "atardecer", name: "Atardecer" },
    { id: "bosque", name: "Bosque" },
    { id: "rocket", name: "Rocket" }
  ];
  const ICON_SUN = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const ICON_MOON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

  function applyTheme() {
    const mode = root.dataset.mode || "dark", pal = root.dataset.theme || "planet";
    localStorage.setItem("pb-mode", mode);
    localStorage.setItem("pb-theme", pal);
    document.querySelectorAll(".dot").forEach(d => d.classList.toggle("on", d.dataset.t === pal));
    document.querySelectorAll(".mode-btn").forEach(b => {
      const dark = mode === "dark";
      b.innerHTML = dark ? ICON_SUN : ICON_MOON;
      b.title = dark ? "Cambiar a modo claro" : "Cambiar a modo oscuro";
      b.setAttribute("aria-label", b.title);
    });
  }
  document.querySelectorAll(".controls").forEach(c => {
    c.innerHTML = '<div class="themes">' + PALETTES.map(p =>
      `<button class="dot" type="button" data-t="${p.id}" title="${p.name}" aria-label="Color ${p.name}"></button>`
    ).join("") + '<span class="sep"></span><button class="mode-btn" type="button"></button></div>';
  });
  document.addEventListener("click", e => {
    const dot = e.target.closest(".dot");
    if (dot) { root.dataset.theme = dot.dataset.t; applyTheme(); return; }
    if (e.target.closest(".mode-btn")) {
      root.dataset.mode = root.dataset.mode === "dark" ? "light" : "dark";
      applyTheme();
    }
  });
  applyTheme();


  // ----- Detalles de interfaz -----
  const EYE = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_OFF = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6A16 16 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 4.4-1"/></svg>';
  $("eye").innerHTML = EYE;
  $("eye").onclick = () => {
    const show = $("pass").type === "password";
    $("pass").type = show ? "text" : "password";
    $("eye").innerHTML = show ? EYE_OFF : EYE;
  };
  const lines = $("lines"); let seen = 0;
  new MutationObserver(() => {
    const cards = lines.querySelectorAll(".card");
    cards.forEach((c, i) => {
      if (seen === 0) { c.style.animationDelay = i * 70 + "ms"; c.classList.add("enter"); }
      else if (i >= seen) c.classList.add("enter");
    });
    seen = cards.length;
  }).observe(lines, { childList: true });
  let lastTot = "";
  new MutationObserver(() => {
    const t = $("tot");
    if (t.textContent !== lastTot) { lastTot = t.textContent; t.classList.remove("bump"); void t.offsetWidth; t.classList.add("bump"); }
  }).observe($("tot"), { childList: true, characterData: true, subtree: true });

  // ----- Login -----
  // Identificador del usuario: SHA-256 del correo (igual que en las herramientas).
  async function emailId(email) {
    const d = await crypto.subtle.digest("SHA-256", enc.encode(email));
    return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, "0")).join("");
  }
  async function unlock(email, password) {
    const id = await emailId(email);
    const db = await (await fetch("data/users.json", { cache: "no-store" })).json();
    const u = db.users.find(x => x.id === id);
    if (!u) throw new Error("usuario");
    const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: unb64(u.salt), iterations: u.iterations, hash: "SHA-256" }, base, 256);
    const pk = await crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["decrypt"]);
    const p = JSON.parse(dec.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(u.iv) }, pk, unb64(u.data))));
    const mk = await crypto.subtle.importKey("raw", unb64(p.mk), "AES-GCM", false, ["decrypt"]);
    const all = unb64((await (await fetch("data/app.enc", { cache: "no-store" })).text()).trim());
    const src = await crypto.subtle.decrypt({ name: "AES-GCM", iv: all.slice(0, 12) }, mk, all.slice(12));
    return { name: p.name, code: dec.decode(src) };
  }

  $("login-form").addEventListener("submit", async e => {
    e.preventDefault();
    $("err").textContent = "";
    $("go").disabled = true; $("go").classList.add("loading");
    let res;
    try {
      res = await unlock($("email").value.trim().toLowerCase(), $("pass").value);
    } catch {
      $("err").textContent = "Correo o contraseña incorrectos.";
      $("go").disabled = false; $("go").classList.remove("loading");
      const card = document.querySelector(".login-card");
      card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
      $("pass").value = "";
      return;
    }
    $("who").textContent = res.name;
    $("login").hidden = true;
    $("app").hidden = false;
    new Function(res.code)();
  });

  $("logout").onclick = () => location.reload();
})();
</script>
</body>
</html>
